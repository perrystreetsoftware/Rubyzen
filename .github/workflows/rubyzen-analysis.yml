name: RubyZen Analysis

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Show environment info
      run: |
        echo "Event: $GITHUB_EVENT_NAME | Repository: ${{ github.repository }}"
        echo "Ruby: $(ruby --version || echo 'Not installed')"

    - name: Checkout RubyZen project
      uses: actions/checkout@v4
      with:
        repository: 'perrystreetsoftware/Rubyzen'
        path: 'rubyzen'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout PR code into temporary directory
      uses: actions/checkout@v4
      with:
        path: 'temp-checkout'
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Verify RubyZen checkout
      run: |
        echo "RubyZen project structure verified"
        ls -la rubyzen/lib/ rubyzen/sample_project/ || echo "Missing expected directories"

    - name: Verify PR code checkout
      run: |
        echo "Checking for src directory in PR code..."
        find temp-checkout/ -name "src" -type d || echo "No src directory found"

    - name: Move PR code to target_project structure
      run: |
        mkdir -p rubyzen/target_project
        # Move all files including hidden ones
        mv temp-checkout/* temp-checkout/.[^.]* rubyzen/target_project/ 2>/dev/null || true

        if [ -d "rubyzen/target_project/src" ]; then
          echo "✅ Found src directory"
        else
          echo "❌ No src directory found"
          # Only create src for RubyZen self-testing (check if this is the RubyZen repo)
          if [ "${{ github.repository }}" = "perrystreetsoftware/Rubyzen" ]; then
            echo "🔧 Detected RubyZen repository - creating src structure for self-test"
            mkdir -p rubyzen/target_project/src
            cp -r rubyzen/target_project/sample_project/src/* rubyzen/target_project/src/
            echo "✅ Created src directory with sample project content"
          else
            echo "⚠️ Not a RubyZen repository - src directory is required but missing"
            echo "This repository needs a 'src' directory for RubyZen analysis to work"
            exit 1
          fi
        fi

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        working-directory: 'rubyzen'
        bundler-cache: true

    - name: Install RubyZen dependencies
      run: bundle install
      working-directory: 'rubyzen'

    - name: Verify RubyZen configuration
      run: |
        echo "Checking RubyZen configuration..."
        cat .rubyzen.yaml || echo "No .rubyzen.yaml found"
        ls -la target_project/src/ || echo "target_project/src not found"
        echo "✅ Ready to run RubyZen analysis"
      working-directory: 'rubyzen'
      env:
        RUBYZEN_TARGET_PROJECT: 'target_project'

    - name: Run RubyZen analysis
      id: analysis
      run: |
        echo "Starting RubyZen analysis..."
        bundle exec rspec sample_project/spec/ --format documentation 2>&1 | tee analysis_output.txt
        echo "RSpec exit code: $?"
      working-directory: 'rubyzen'
      continue-on-error: true
      env:
        RUBYZEN_TARGET_PROJECT: 'target_project'


    - name: Update PR comment with analysis results
      uses: actions/github-script@v7
      if: always() && github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          let analysisOutput = 'Analysis file not found';
          let debugInfo = '';

          try {
            analysisOutput = fs.readFileSync('rubyzen/analysis_output.txt', 'utf8');
          } catch (error) {
            debugInfo = `\n\n**Debug Info:** Failed to read analysis output: ${error.message}`;
          }

          const body = `## 🔍 RubyZen Analysis Results

          \`\`\`
          ${analysisOutput}
          \`\`\`
          ${debugInfo}

          ---
          *Analysis completed at ${new Date().toISOString()}*`;

          // Look for existing RubyZen comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.data.find(comment =>
            comment.body.includes('🔍 RubyZen Analysis Results')
          );

          if (existingComment) {
            // Delete old comment and create new one for fresh timestamp
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id
            });
            console.log('Deleted existing RubyZen comment');
          }

          // Create new comment (always, whether replacing or first time)
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
          console.log('Created new RubyZen comment');
