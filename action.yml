name: 'RubyZen Analysis'
description: 'Run RubyZen architectural linting on your Ruby project'
author: 'Perry Street Software'

inputs:
  token:
    description: 'GitHub token for API access'
    required: true
  ruby-version:
    description: 'Ruby version to use'
    required: false
    default: '3.3'
  target-directory:
    description: 'Directory containing the Ruby source code to analyze'
    required: false
    default: 'src'

outputs:
  violations-found:
    description: 'Whether violations were found (true/false)'
    value: ${{ steps.run-analysis.outputs.violations-found }}
  analysis-result:
    description: 'Full analysis output'
    value: ${{ steps.run-analysis.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - name: Install RubyZen dependencies
      shell: bash
      run: bundle install
      working-directory: ${{ github.action_path }}

    - name: Prepare target project structure
      shell: bash
      run: |
        echo "Preparing target project structure..."
        mkdir -p target_project

        # Check if target directory exists in the workspace
        if [ -d "${{ github.workspace }}/${{ inputs.target-directory }}" ]; then
          echo "✅ Found ${{ inputs.target-directory }} directory"
          cp -r "${{ github.workspace }}/${{ inputs.target-directory }}" target_project/src
        else
          echo "❌ No ${{ inputs.target-directory }} directory found"
          # For RubyZen self-testing, use sample project
          if [ "${{ github.repository }}" = "perrystreetsoftware/Rubyzen" ]; then
            echo "🔧 Using sample project for RubyZen self-test"
            cp -r sample_project/src target_project/src
          else
            echo "⚠️ Repository needs a '${{ inputs.target-directory }}' directory for analysis"
            exit 1
          fi
        fi

        echo "Target project structure ready:"
        ls -la target_project/src/ || echo "No src files found"
      working-directory: ${{ github.action_path }}

    - name: Run RubyZen analysis
      id: run-analysis
      shell: bash
      run: |
        echo "Starting RubyZen analysis..."

        # Run analysis and capture output
        if bundle exec rspec sample_project/spec/ --format documentation 2>&1 | tee analysis_output.txt; then
          echo "violations-found=false" >> $GITHUB_OUTPUT
        else
          echo "violations-found=true" >> $GITHUB_OUTPUT
        fi

        # Set the full result as output
        echo "result<<EOF" >> $GITHUB_OUTPUT
        cat analysis_output.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "Analysis complete"
      working-directory: ${{ github.action_path }}
      env:
        RUBYZEN_TARGET_PROJECT: 'target_project'

    - name: Update PR comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && github.event.pull_request.number
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          let analysisOutput = 'Analysis file not found';
          try {
            analysisOutput = fs.readFileSync('analysis_output.txt', 'utf8');
          } catch (e) {}

          const violationsFound = '${{ steps.run-analysis.outputs.violations-found }}' === 'true';
          const statusIcon = violationsFound ? '❌' : '✅';
          const statusText = violationsFound ? 'Violations found' : 'No violations found';

          const body = [
            '## 🔍 RubyZen Analysis Results',
            '',
            `${statusIcon} **${statusText}**`,
            '',
            '<details open>',
            '<summary>📋 Full Analysis Report</summary>',
            '',
            '```',
            analysisOutput,
            '```',
            '',
            '</details>',
            '',
            '---',
            `*Analysis completed at ${new Date().toISOString()}*`
          ].join('\n');

          // Look for existing RubyZen comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.data.find(comment =>
            comment.body.includes('🔍 RubyZen Analysis Results')
          );

          if (existingComment) {
            // Delete old comment and create new one for fresh timestamp
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id
            });
            console.log('Deleted existing RubyZen comment');
          }

          // Create new comment
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
          console.log('Created new RubyZen comment');
      # No working-directory here; not supported for uses steps

branding:
  icon: 'check-circle'
  color: 'green'
