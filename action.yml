name: 'RubyZen Analysis'
description: 'Run RubyZen architectural linting on your Ruby project'
author: 'Perry Street Software'

inputs:
  token:
    description: 'GitHub token for API access'
    required: true
  ruby-version:
    description: 'Ruby version to use'
    required: false
    default: '3.3'
  target-directories:
    description: 'Comma-separated directories containing Ruby source code to analyze (e.g., "src,spec")'
    required: false
    default: 'src'
  target-rspec-directory:
    description: 'Directory containing the RSpec test files'
    required: false
    default: 'spec'

outputs:
  violations-found:
    description: 'Whether violations were found (true/false)'
    value: ${{ steps.run-analysis.outputs.violations-found }}
  analysis-result:
    description: 'Full analysis output'
    value: ${{ steps.run-analysis.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false

    - name: Debug - Show github.action_path and files
      shell: bash
      run: |
        echo "github.action_path: ${{ github.action_path }}"
        pwd
        ls -la
      working-directory: ${{ github.action_path }}

    - name: Install RubyZen dependencies
      shell: bash
      run: bundle install
      working-directory: ${{ github.action_path }}

    - name: Run RubyZen analysis
      id: run-analysis
      shell: bash
      run: |
        echo "Starting RubyZen analysis..."
        echo ""

        # Echo all input parameters for debugging
        echo "📋 Input Parameters:"
        echo "  target-directories: '${{ inputs.target-directories }}'"
        echo "  target-rspec-directory: '${{ inputs.target-rspec-directory }}'"
        echo ""

        # Use target-directories input (comma-separated format)
        RAW_PATHS="${{ inputs.target-directories }}"

        # Build absolute paths (assuming comma-separated format)
        WORKSPACE="${{ github.workspace }}"
        RUBYZEN_PATHS="${RAW_PATHS//,/,$WORKSPACE/}"
        RUBYZEN_PATHS="$WORKSPACE/$RUBYZEN_PATHS"

        # Export as environment variable for the Ruby process
        export RUBYZEN_PROJECT_PATHS="$RUBYZEN_PATHS"

        echo ""
        echo "📁 Resolved Paths:"
        echo "  Workspace: $WORKSPACE"
        echo "  Raw paths: $RAW_PATHS"
        echo "  Full paths: $RUBYZEN_PATHS"
        echo ""

        # Validate target directories
        echo "🔍 Validating target directories..."
        IFS=',' read -ra PATHS <<< "$RUBYZEN_PATHS"
        for path in "${PATHS[@]}"; do
          if [ ! -d "$path" ]; then
            echo "❌ Target directory not found: $path"
            echo "Available directories in workspace:"
            find $WORKSPACE -maxdepth 2 -type d 2>/dev/null || echo "No directories found"
            exit 1
          fi
          echo "✅ Found: $path"
        done

        # Validate RSpec directory
        RSPEC_DIR="$WORKSPACE/${{ inputs.target-rspec-directory }}"
        echo ""
        echo "🧪 Validating RSpec directory..."
        echo "  RSpec directory: $RSPEC_DIR"
        if [ ! -d "$RSPEC_DIR" ]; then
          echo "❌ RSpec directory not found: $RSPEC_DIR"
          echo "Available spec directories:"
          find $WORKSPACE -type d -name "*spec*" 2>/dev/null || echo "No spec directories found"
          exit 1
        fi
        echo "✅ Found RSpec directory: $RSPEC_DIR"

        echo ""
        echo "🚀 Starting analysis..."
        echo "  Analyzing paths: $RUBYZEN_PATHS"
        echo "  Running tests from: $RSPEC_DIR"
        echo ""

        # Run analysis and capture both output and exit code
        set +e  # Don't exit on command failure
        bundle exec rspec -Ilib "$RSPEC_DIR" --format documentation 2>&1 | tee $GITHUB_WORKSPACE/analysis_output.txt

        ANALYSIS_EXIT_CODE=$?
        set -e  # Re-enable exit on error

        # Set outputs based on exit code
        if [ $ANALYSIS_EXIT_CODE -eq 0 ]; then
          echo "violations-found=false" >> $GITHUB_OUTPUT
          echo "✅ Analysis passed - no violations found"
        else
          echo "violations-found=true" >> $GITHUB_OUTPUT
          echo "❌ Analysis failed - violations found"
        fi

        # Set the full result as output
        echo "result<<EOF" >> $GITHUB_OUTPUT
        cat $GITHUB_WORKSPACE/analysis_output.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "Analysis complete"

        # Exit with the original analysis exit code to fail the action if violations found
        exit $ANALYSIS_EXIT_CODE
      working-directory: ${{ github.action_path }}
branding:
  icon: 'check-circle'
  color: 'green'
